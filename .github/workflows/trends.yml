name: tendencias
# 4×/dia (07h, 11h, 16h, 20h em SP), para poupar a cota da assinatura: coleta → hype score → triagem → ideias. Hype alto = via expressa 🔥.
on:
  schedule:
    - cron: "17 10,14,19,23 * * *"
  workflow_dispatch:
concurrency:
  group: jarvis-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_DIR: data
      PREVIEWS_DIR: previews
      LIBRARY_DIR: library
      JARVIS_PLATFORMS: ${{ vars.JARVIS_PLATFORMS }}
      # claude-code = assinatura (CLAUDE_CODE_OAUTH_TOKEN); api = paga por token.
      JARVIS_LLM: ${{ vars.JARVIS_LLM || 'claude-code' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          data-token: ${{ secrets.DATA_TOKEN }}
          data-repo: ${{ vars.DATA_REPO }}
          media: "true"
      - if: env.JARVIS_LLM == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      # Mídias novas jogadas na base pelo PWA: etiqueta, recorta e prepara.
      - run: npm run -s jarvis -- library
      - id: hunt
        run: npm run -s jarvis -- trends
      # Via expressa: produz na hora o pacote da tendência (aprovar em até 6h).
      - if: steps.hunt.outputs.express_ids != ''
        run: npx playwright install --with-deps chromium
      - if: steps.hunt.outputs.express_ids != ''
        run: |
          IFS=',' read -ra ids <<< "${{ steps.hunt.outputs.express_ids }}"
          for id in "${ids[@]}"; do npm run -s jarvis -- produce --idea "$id" || true; done
      - if: always()
        run: bash scripts/ci/save.sh "tendências"
