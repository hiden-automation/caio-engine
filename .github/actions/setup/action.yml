name: preparar-jarvis
description: Node, dependências, caio-data (main) e branch previews clonados no runner.
inputs:
  data-token:
    description: PAT fine-grained com Contents read/write no caio-data e no caio-cdn
    required: true
  data-repo:
    description: dono/caio-data
    required: true
  browser:
    description: instalar Chromium (render de artes)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - if: inputs.browser == 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
    - name: clonar caio-data e previews
      shell: bash
      env:
        TOKEN: ${{ inputs.data-token }}
        REPO: ${{ inputs.data-repo }}
      run: |
        url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
        git config --global user.name "jarvis"
        git config --global user.email "jarvis@users.noreply.github.com"
        git clone --quiet --depth 1 "$url" data
        if ! git clone --quiet --depth 1 --branch previews "$url" previews 2>/dev/null; then
          mkdir -p previews && git -C previews init -q -b previews && git -C previews remote add origin "$url"
        fi
