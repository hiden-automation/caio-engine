name: pwa
# Publica o PWA (só código estático; nenhum dado) no GitHub Pages deste repo.
on:
  push:
    branches: [main]
    paths: ["apps/pwa/**", "packages/core/src/schemas.ts", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pwa:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pwa/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
