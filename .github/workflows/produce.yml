name: produzir
# 06:00 e 15:00 em São Paulo: roteiro → arte → QA → fila do PWA.
on:
  schedule:
    - cron: "0 9,18 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: quantos pacotes
        default: "3"
      idea:
        description: id de uma ideia específica (via expressa)
        default: ""
      matrix:
        description: teste em massa (todos os formatos, estilos e pilares)
        type: boolean
        default: false
      concurrency:
        description: pacotes em paralelo
        default: "3"
      only:
        description: "só estes itens da matriz (ex.: 7,10,12)"
        default: ""
concurrency:
  group: jarvis-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_DIR: data
      PREVIEWS_DIR: previews
      LIBRARY_DIR: library
      JARVIS_MATRIX_ONLY: ${{ inputs.only }}
      JARVIS_PLATFORMS: ${{ vars.JARVIS_PLATFORMS }}
      # claude-code = assinatura (CLAUDE_CODE_OAUTH_TOKEN); api = paga por token.
      JARVIS_LLM: ${{ vars.JARVIS_LLM || 'claude-code' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          data-token: ${{ secrets.DATA_TOKEN }}
          data-repo: ${{ vars.DATA_REPO }}
          browser: "true"
          media: "true"
      - if: env.JARVIS_LLM == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      - run: npm run -s jarvis -- reviews
      - run: npm run -s jarvis -- library
      - run: |
          args=()
          [ -n "${{ inputs.count }}" ] && args+=(--count "${{ inputs.count }}")
          [ -n "${{ inputs.idea }}" ] && args+=(--idea "${{ inputs.idea }}")
          [ "${{ inputs.matrix }}" = "true" ] && args+=(--matrix)
          args+=(--concurrency "${{ inputs.concurrency || '2' }}")
          npm run -s jarvis -- produce "${args[@]}"
      - if: always()
        run: bash scripts/ci/save.sh "produção"
